name: SocioLedger CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply controlled Batch 7 auth hardening
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/production-hardening-phase-1'
        run: |
          node scripts/applyBatch7AuthHardening.js
          if ! git diff --quiet -- src/App.jsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- src/App.jsx
            git commit -m "Harden legacy auth self-heal [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Production data safety audit
        run: npm run audit:safety

      - name: Dependency audit (diagnostic)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
