name: Apply reliable payment date hotfix

on:
  push:
    branches: [hotfix/payment-date-production-v2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/payment-date-production-v2
      - name: Replace unreliable native date control
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = '<input type="date" value={paymentForm.date} onChange={(e) => setPaymentForm({ ...paymentForm, date: e.target.value })} />'
          new = '''<input
                type="text"
                inputMode="numeric"
                placeholder="YYYY-MM-DD"
                value={paymentForm.date}
                onChange={(e) => setPaymentForm({ ...paymentForm, date: e.target.value })}
                aria-label="Payment date (YYYY-MM-DD)"
              />'''
          if old not in s:
              raise SystemExit('Expected Payment Entry date field not found; refusing broad edit')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Fix Payment Entry date editing on mobile"
          git push origin HEAD:hotfix/payment-date-production-v2
